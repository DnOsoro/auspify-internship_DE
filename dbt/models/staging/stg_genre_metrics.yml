version: 2

models:
  - name: stg_genre_metrics
    description: "Staging view for Netflix catalogue metrics by genre."

    columns:
      - name: genre
        description: "Genre or category associated with one or more Netflix titles."
        data_tests:
          - not_null

      - name: content_count
        description: "Number of catalogue titles associated with the genre."
        data_tests:
          - not_null

      - name: movie_count
        description: "Number of Movies associated with the genre."
        data_tests:
          - not_null

      - name: tv_show_count
        description: "Number of TV Shows associated with the genre."
        data_tests:
          - not_null

      - name: share_of_genre_assignments
        description: "Share of all genre assignments represented by the genre."
        data_tests:
          - not_null