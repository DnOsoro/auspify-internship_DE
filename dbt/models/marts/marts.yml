version: 2

models:
  - name: mart_dashboard_kpis
    description: "Dashboard-ready executive KPIs for the Netflix catalogue intelligence platform."

    columns:
      - name: total_titles_added
        description: "Total number of titles represented in the catalogue."
        data_tests:
          - not_null

      - name: total_movies_added
        description: "Total number of Movies represented in the catalogue."
        data_tests:
          - not_null

      - name: total_tv_shows_added
        description: "Total number of TV Shows represented in the catalogue."
        data_tests:
          - not_null

      - name: movie_share
        description: "Proportion of the catalogue represented by Movies."
        data_tests:
          - not_null

      - name: tv_show_share
        description: "Proportion of the catalogue represented by TV Shows."
        data_tests:
          - not_null

      - name: peak_year
        description: "Complete year with the highest number of catalogue additions."
        data_tests:
          - not_null

      - name: peak_year_additions
        description: "Number of titles added during the peak complete year."
        data_tests:
          - not_null

  - name: mart_catalogue_trends
    description: "Dashboard-ready yearly catalogue addition trends, including completeness status for each observation year."

    columns:
      - name: year_added
        description: "Year in which the titles were added to the Netflix catalogue."
        data_tests:
          - not_null

      - name: content_count
        description: "Total number of titles added during the year."
        data_tests:
          - not_null

      - name: movie_count
        description: "Number of Movies added during the year."
        data_tests:
          - not_null

      - name: tv_show_count
        description: "Number of TV Shows added during the year."
        data_tests:
          - not_null

      - name: movie_share
        description: "Share of yearly catalogue additions represented by Movies."
        data_tests:
          - not_null

      - name: tv_show_share
        description: "Share of yearly catalogue additions represented by TV Shows."
        data_tests:
          - not_null

      - name: is_complete_year
        description: "Indicates whether the year represents a complete observation period."
        data_tests:
          - not_null

      - name: period_status
        description: "Human-readable completeness status for the observation period."
        data_tests:
          - not_null

  - name: mart_country_metrics
    description: "Dashboard-ready Netflix catalogue metrics by country."

    columns:
      - name: country
        description: "Country associated with one or more Netflix catalogue titles."
        data_tests:
          - not_null

      - name: content_count
        description: "Number of catalogue titles associated with the country."
        data_tests:
          - not_null

      - name: movie_count
        description: "Number of Movies associated with the country."
        data_tests:
          - not_null

      - name: tv_show_count
        description: "Number of TV Shows associated with the country."
        data_tests:
          - not_null

      - name: share_of_country_assignments
        description: "Share of all country assignments represented by the country."
        data_tests:
          - not_null

  - name: mart_genre_metrics
    description: "Genre-level catalogue metrics for dashboard analysis."
    columns:
      - name: genre
        data_tests:
          - not_null
      - name: content_count
        data_tests:
          - not_null
      - name: movie_count
        data_tests:
          - not_null
      - name: tv_show_count
        data_tests:
          - not_null
      - name: share_of_genre_assignments
        data_tests:
          - not_null

  - name: mart_rating_metrics
    description: "Content rating metrics for dashboard analysis."
    columns:
      - name: rating
        data_tests:
          - not_null
      - name: content_count
        data_tests:
          - not_null
      - name: movie_count
        data_tests:
          - not_null
      - name: tv_show_count
        data_tests:
          - not_null
      - name: share_of_catalogue
        data_tests:
          - not_null

  - name: mart_forecasts
    description: "Forecast baseline results for catalogue trend analysis."
    columns:
      - name: forecast_year
        data_tests:
          - not_null
      - name: forecast_content_count
        data_tests:
          - not_null
      - name: model
        data_tests:
          - not_null
      - name: forecast_type
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null

  - name: mart_ml_performance
    description: "Machine learning model evaluation metrics for dashboard comparison."
    columns:
      - name: model
        data_tests:
          - not_null
      - name: accuracy
        data_tests:
          - not_null
      - name: precision
        data_tests:
          - not_null
      - name: recall
        data_tests:
          - not_null
      - name: f1_score
        data_tests:
          - not_null
      - name: selected
        data_tests:
          - not_null

  - name: mart_data_quality
    description: "Data quality checks and status information for the catalogue pipeline."
    columns:
      - name: metric
        data_tests:
          - not_null
      - name: value
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null